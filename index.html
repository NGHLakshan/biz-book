<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BizBook" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- SEO -->
    <title>Anura Biz Book — Income &amp; Expense Tracker</title>
    <meta name="description" content="Offline-first mobile app to track business income and expenses for Bus, JCB and other operations. Works without internet and syncs automatically." />

    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Aggressively hide Netlify injected badge
      const observer = new MutationObserver(() => {
        document.querySelectorAll('a, div').forEach(el => {
          if (el.textContent === 'Powered by Netlify' || (el.innerText && el.innerText.includes('Powered by Netlify'))) {
            el.style.display = 'none';
            el.style.visibility = 'hidden';
            el.style.opacity = '0';
          }
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
